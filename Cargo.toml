[workspace]
resolver = "2"
exclude = ["sidecar"]
members = [
    "crates/rt-bencode",
    "crates/rt-metainfo",
    "crates/rt-hash",
    "crates/rt-path",
    "crates/rt-storage",
    "crates/rt-piece-map",
    "crates/rt-fastresume",
    "crates/rt-tracker",
    "crates/rt-peer-wire",
    "crates/rt-peer-manager",
    "crates/rt-piece-picker",
    "crates/rt-dht",
    "crates/rt-utp",
    "crates/rt-session",
    "crates/rt-db",
    "crates/rt-jobs",
    "crates/rt-api-model",
    "crates/rt-api-native",
    "crates/rt-api-qbit",
    "crates/rt-api-transmission",
    "crates/rt-api-deluge",
    "crates/rt-api-rtorrent",
    "crates/rt-metrics",
    "crates/rt-config",
    "crates/rt-logging",
    "crates/rt-engine",
    "crates/rt-migrate",
    "crates/rt-testkit",
    "crates/torrentngd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-or-later"
authors = ["TorrentNG contributors"]
repository = "https://github.com/snapetech/TorrentNG"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
hyper = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# error handling
anyhow = "1"
thiserror = "1"

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# database
rusqlite = { version = "0.31", features = ["bundled"] }

# crypto
sha1 = "0.10"
sha2 = "0.10"

# http client (tracker announces)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# metrics
prometheus = "0.13"

# utilities
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
url = "2"
hex = "0.4"
base64 = "0.22"
once_cell = "1"
libc = "0.2"

# test utilities (dev only)
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
opt-level = 3
debug = true