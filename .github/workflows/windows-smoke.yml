name: Windows Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sidecar/**"
      - "webui/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    timeout-minutes: 45
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build compatible-client service
        run: cargo build --locked --manifest-path sidecar/Cargo.toml

      - name: Test compatible-client service
        run: cargo test --locked --manifest-path sidecar/Cargo.toml

      # rt-storage ships a non-Unix fallback executor for move/import/delete
      # plans (plan.rs's cfg(not(unix)) path) that release.yml proves compiles
      # for Windows but that no CI job actually ran until now -- this is the
      # only job that runs the TorrentNG client workspace on a real Windows machine.
      - name: Test TorrentNG storage plan executor
        run: cargo test --locked -p rt-storage

      - name: Build webui
        working-directory: webui
        run: |
          npm.cmd ci
          npm.cmd run build
