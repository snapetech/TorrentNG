name: Release

on:
  push:
    tags:
      - "main-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and provenance
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual releases must be dispatched from the default main branch." >&2
            exit 1
          fi
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^main-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
            [[ "$tag" == *..* ]] || ! git check-ref-format "refs/tags/$tag"; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          git fetch --force origin main --tags
          tag_commit="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}")"
          if [[ -z "$tag_commit" ]] || ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $tag must point to a commit on origin/main." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-notes:
    name: Assemble release notes
    needs: validate-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.release-body.outputs.release_body }}
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Find previous published release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' \
            | awk -v current="$RELEASE_TAG" '$0 != current && !found { print; found = 1 }')"
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Assemble curated release notes
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--head "$RELEASE_TAG" --output release-notes.md)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--base "$PREVIOUS_TAG")
          fi
          python3 scripts/release_notes.py assemble "${args[@]}"
          test -s release-notes.md
          cat release-notes.md

      - name: Export release body
        id: release-body
        shell: bash
        run: |
          set -euo pipefail
          delimiter="release_body_${GITHUB_RUN_ID}"
          {
            echo "release_body<<${delimiter}"
            cat release-notes.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  native-quality:
    name: TorrentNG client and compatible-client service quality gate
    needs: validate-release-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate TorrentNG API contract
        run: python3 scripts/validate_openapi.py

      - name: Test protected API target and load-runner boundaries
        run: python3 -m unittest scripts.test_protected_target scripts.test_backend_burndown_api_load scripts.test_workflow_security

      - name: Test TorrentNG client workspace
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

      - name: Lint TorrentNG client workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check compatible-client service formatting
        run: cargo fmt --manifest-path sidecar/Cargo.toml -- --check

      - name: Test compatible-client service
        run: cargo test --locked --manifest-path sidecar/Cargo.toml

      - name: Lint compatible-client service
        run: cargo clippy --all-targets --locked --manifest-path sidecar/Cargo.toml -- -D warnings

  msrv-check:
    name: Main workspace MSRV gate
    needs: [validate-release-tag, native-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      - name: Build TorrentNG client workspace at declared MSRV
        run: cargo build --workspace --all-targets --locked

      - name: Test TorrentNG client workspace at declared MSRV
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

  msrv-check-sidecar:
    name: Compatible-client service MSRV gate
    needs: [validate-release-tag, native-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Build compatible-client service at declared MSRV
        run: cargo build --locked --manifest-path sidecar/Cargo.toml

      - name: Test compatible-client service at declared MSRV
        run: cargo test --locked --manifest-path sidecar/Cargo.toml

  security-audit:
    name: Release dependency security gate
    needs: [validate-release-tag, native-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file sidecar/Cargo.lock
          cargo audit --file fuzz/Cargo.lock

      - name: Audit compatible-client service Rust dependencies
        working-directory: sidecar
        run: cargo audit

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Audit WebUI dependencies
        working-directory: webui
        run: |
          npm ci
          npm audit --audit-level=high

  native-release-smoke:
    name: Native release-binary smoke
    needs: [validate-release-tag, native-quality, msrv-check, msrv-check-sidecar, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build native release binary
        run: cargo build --release --locked -p torrentngd

      - name: Run authenticated release-binary smoke
        run: |
          set -euo pipefail
          TNG_RELEASE_CONFIG=certification/fixtures/backend-burndown-native-release-smoke.toml \
          TNG_RELEASE_TOKEN=backend-burndown-token-20260902 \
            scripts/backend_burndown_native_release_smoke.sh \
            "certification/reports/backend-burndown-native-release-smoke-ci-${GITHUB_RUN_ID}.md"

      - name: Run backup and restore drill
        run: |
          scripts/backup_restore_certification.sh \
            "certification/reports/backup-restore-release-${GITHUB_RUN_ID}.md"

      - name: Upload native release smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-release-smoke-${{ github.run_id }}
          path: |
            certification/reports/backend-burndown-native-release-smoke-ci-*
            certification/reports/backup-restore-release-*
          if-no-files-found: error

  native-binaries:
    name: Native binary (${{ matrix.suffix }})
    needs: [validate-release-tag, native-quality, msrv-check, msrv-check-sidecar, security-audit, native-release-smoke]
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            binary: torrentngd
            archive: tar.gz
          - os: ubuntu-24.04-arm
            suffix: linux-aarch64
            binary: torrentngd
            archive: tar.gz
          - os: macos-14
            suffix: macos-aarch64
            binary: torrentngd
            archive: tar.gz
          - os: windows-latest
            suffix: windows-x86_64
            binary: torrentngd.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Build WebUI
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          TNG_WEBUI_OUT_DIR=dist npm run build

      - name: Build TorrentNG client daemon
        shell: bash
        run: cargo build --release --locked -p torrentngd

      - name: Smoke TorrentNG client daemon version
        env:
          RELEASE_BINARY: ${{ matrix.binary }}
        shell: bash
        run: |
          set -euo pipefail
          "target/release/$RELEASE_BINARY" --version

      - name: Package TorrentNG client assets
        env:
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:?RELEASE_TAG must be set}"
          suffix="${RELEASE_SUFFIX:?RELEASE_SUFFIX must be set}"
          binary="${RELEASE_BINARY:?RELEASE_BINARY must be set}"
          mkdir -p dist native/usr/bin native/usr/share/torrentng/webui
          artifact_suffix=""
          if [[ "$binary" == "torrentngd.exe" ]]; then
            artifact_suffix=".exe"
          fi
          cp "target/release/$binary" "dist/torrentngd-${suffix}${artifact_suffix}"
          cp "target/release/$binary" "native/usr/bin/$binary"
          cp -a webui/dist/. native/usr/share/torrentng/webui/
          if [[ "$RELEASE_ARCHIVE" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path native/* -DestinationPath dist/torrentngd-native-${tag}-${suffix}.zip -Force"
          else
            tar -czf "dist/torrentngd-native-${tag}-${suffix}.tar.gz" -C native .
          fi

      - name: Upload TorrentNG client artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.suffix }}
          path: dist/*

  linux-release-assets:
    name: Linux containers and shared assets
    needs: [validate-release-tag, native-quality, msrv-check, msrv-check-sidecar, security-audit, native-release-smoke]
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build compatible-client service
        run: cargo build --release --locked --manifest-path sidecar/Cargo.toml

      - name: Run compatible-client service tests
        run: cargo test --locked --manifest-path sidecar/Cargo.toml

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          TNG_WEBUI_OUT_DIR=dist npm run build

      - name: Build Docker images
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        run: |
          docker build --pull --network host -f deploy/native/Dockerfile -t "torrentng-native:${RELEASE_TAG}" .
          docker build --pull --network host -f deploy/docker/Dockerfile -t "torrentng:${RELEASE_TAG}" .
          docker build --pull --network host -f deploy/docker/Dockerfile.phase1 -t "torrentng-phase1:${RELEASE_TAG}" .

      - name: Smoke native image with authenticated read-only runtime
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          name="torrentng-native-smoke-${GITHUB_RUN_ID}"
          data_volume="${name}-data"
          downloads_volume="${name}-downloads"
          state_volume="${name}-state"
          config_volume="${name}-config"
          containers=("$name")
          volumes=("$data_volume" "$downloads_volume" "$state_volume" "$config_volume")
          cleanup() {
            docker rm -f "${containers[@]}" >/dev/null 2>&1 || true
            docker volume rm "${volumes[@]}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for volume in "${volumes[@]}"; do
            docker volume create "$volume" >/dev/null
          done
          docker run -d --name "$name" --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /run:rw,nosuid,nodev,size=16m \
            -v "$data_volume:/data" \
            -v "$downloads_volume:/downloads" \
            -v "$state_volume:/var/lib/torrentngd" \
            -v "$config_volume:/config" \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TORRENTNGD_API_TOKEN=release-smoke-only-token \
            "torrentng-native:${RELEASE_TAG}" >/dev/null

          healthy=0
          for _ in $(seq 1 60); do
            if docker exec "$name" curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != 1 ]]; then
            docker logs "$name"
            exit 1
          fi
          [[ "$(docker exec "$name" awk '/^Uid:/{print $2}' /proc/1/status)" == 1000 ]]
          [[ "$(docker exec "$name" awk '/^Gid:/{print $2}' /proc/1/status)" == 1000 ]]
          docker exec --user 1000:1000 "$name" sh -c \
            'test -w /data && test -w /downloads && test -w /var/lib/torrentngd && test -w /run/secrets/torrentngd_api_token'
          docker exec "$name" /usr/local/bin/torrentngd --version

      - name: Smoke compatible-client image with root-owned persistent files
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}"
          containers=()
          volumes=()
          cleanup() {
            docker rm -f "${containers[@]}" >/dev/null 2>&1 || true
            docker volume rm "${volumes[@]}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          run_smoke() {
            local name="torrentng-identity-smoke-${suffix}-$1"
            local data_dir="$2"
            local log_volume="${name}-log"
            local default_volume="${name}-default-data"
            local override_volume="${name}-override-data"
            containers+=("$name")
            volumes+=("$log_volume" "$default_volume" "$override_volume")
            docker volume create "$log_volume" >/dev/null
            docker volume create "$default_volume" >/dev/null
            docker volume create "$override_volume" >/dev/null
            docker run --rm --entrypoint /bin/sh \
              -v "$log_volume:/var/log/rtorrent" \
              -v "$default_volume:/var/lib/torrentng" \
              -v "$override_volume:/var/lib/rtorrentng" alpine:3.20 \
              -c 'touch /var/log/rtorrent/rtorrent.log /var/lib/torrentng/cache.db /var/lib/rtorrentng/cache.db && chmod 0664 /var/log/rtorrent/rtorrent.log /var/lib/torrentng/cache.db /var/lib/rtorrentng/cache.db'
            docker run -d --name "$name" --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=1g \
              --tmpfs /run:rw,nosuid,nodev,size=128m \
              -v "$log_volume:/var/log/rtorrent" \
              -v "$default_volume:/var/lib/torrentng" \
              -v "$override_volume:/var/lib/rtorrentng" \
              -e "TNG_DATA_DIR=$data_dir" \
              -e RTORRENT_STARTUP_GRACE_SECS=0 \
              -e TNG_SECRET_KEY=release-smoke-only-session-secret \
              -e TNG_API_TOKENS=release-smoke-only-token \
              "torrentng:${RELEASE_TAG}" >/dev/null

            local healthy=0
            for _ in $(seq 1 60); do
              if docker exec "$name" wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 1
            done
            if [[ "$healthy" != 1 ]]; then
              docker logs "$name"
              return 1
            fi
            docker exec "$name" test -S /run/rtorrent/rpc.sock
            docker exec --user 1000:1000 "$name" sh -c 'test -w /var/log/rtorrent/rtorrent.log && test -w /var/lib/torrentng && test -w /var/lib/torrentng/cache.db && test -w /var/lib/rtorrentng && test -w /var/lib/rtorrentng/cache.db'
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/log/rtorrent/rtorrent.log)" == "1000:1000" ]]
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/lib/torrentng)" == "1000:1000" ]]
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/lib/torrentng/cache.db)" == "1000:1000" ]]
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/lib/rtorrentng)" == "1000:1000" ]]
            [[ "$(docker exec "$name" stat -c '%u:%g' /var/lib/rtorrentng/cache.db)" == "1000:1000" ]]
            docker rm -f "$name" >/dev/null
          }

          run_smoke override /var/lib/rtorrentng
          run_smoke default /var/lib/torrentng

      - name: Publish Docker images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#main-}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

          publish_image() {
            local local_image="$1"
            local ghcr_image="$2"
            local dockerhub_image="$3"
            for tag in "$RELEASE_TAG" "$version" latest; do
              docker tag "$local_image:$RELEASE_TAG" "$ghcr_image:$tag"
              docker push "$ghcr_image:$tag"
              if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
                docker tag "$local_image:$RELEASE_TAG" "$dockerhub_image:$tag"
                docker push "$dockerhub_image:$tag"
              fi
            done
          }

          publish_image torrentng-native ghcr.io/snapetech/torrentng/native snapetech/torrentng-native
          publish_image torrentng ghcr.io/snapetech/torrentng/sidecar snapetech/torrentng-sidecar
          publish_image torrentng-phase1 ghcr.io/snapetech/torrentng/phase1 snapetech/torrentng-phase1

      - name: Package shared assets
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          mkdir -p dist
          cp sidecar/target/release/torrentng "dist/torrentng-linux-x86_64"
          tar -czf "dist/torrentng-webui-${tag}.tar.gz" -C webui/dist .
          tar -czf "dist/torrentng-deploy-${tag}.tar.gz" deploy docs README.md LICENSE

      - name: Upload shared artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-linux-assets
          path: dist/*

  yunohost-bundles:
    name: YunoHost portable bundle (${{ matrix.suffix }})
    needs: [validate-release-tag, native-quality, msrv-check, msrv-check-sidecar, security-audit]
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: linux-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.validate-release-tag.outputs.tag }}
          persist-credentials: false

      - name: Build YunoHost portable bundle
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET_SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          docker buildx build \
            --pull \
            --platform "$PLATFORM" \
            --file packaging/yunohost/Dockerfile.bundle \
            --target bundle \
            --output "type=local,dest=bundle" \
            .
          chmod -R a+rX bundle
          chmod 0755 bundle
          test -x bundle/bin/torrentngd
          test -x bundle/bin/torrentng
          test -s bundle/webui/index.html
          bundle_file="torrentng-yunohost-${RELEASE_TAG}-${ASSET_SUFFIX}.tar.gz"
          tar -czf "$bundle_file" -C bundle .
          [[ "$(tar -tvf "$bundle_file" | awk 'NR == 1 { print $1 }')" == "drwxr-xr-x" ]]

      - name: Upload YunoHost bundle
        uses: actions/upload-artifact@v7
        with:
          name: yunohost-${{ matrix.suffix }}
          path: torrentng-yunohost-${{ needs.validate-release-tag.outputs.tag }}-${{ matrix.suffix }}.tar.gz

  publish:
    name: Publish release
    runs-on: [self-hosted, Linux, X64]
    needs:
      - validate-release-tag
      - release-notes
      - native-binaries
      - linux-release-assets
      - yunohost-bundles
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > "SHA256SUMS-${RELEASE_TAG}.txt"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ needs.release-notes.outputs.release_body }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "TorrentNG $tag" \
              --notes "$RELEASE_BODY"
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "TorrentNG $tag" \
              --notes "$RELEASE_BODY" \
              --verify-tag
          fi

      - name: Dispatch AUR publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: gh workflow run release-aur.yml --ref main -f "tag=$RELEASE_TAG"

      - name: Dispatch COPR publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: gh workflow run release-copr.yml --ref main -f "tag=$RELEASE_TAG"

      - name: Dispatch Launchpad PPA publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: gh workflow run release-ppa.yml --ref main -f "tag=$RELEASE_TAG"

      - name: Check Discord webhook configuration
        id: discord
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        shell: bash
        run: |
          if [[ -n "${DISCORD_RELEASE_WEBHOOK:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Announce release on Discord
        if: success() && steps.discord.outputs.configured == 'true'
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
          RELEASE_BODY: ${{ needs.release-notes.outputs.release_body }}
        shell: bash
        run: |
          set -euo pipefail
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          body="$RELEASE_BODY"
          if (( ${#body} > 3800 )); then
            body="${body:0:3797}…"
          fi
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg url "$release_url" \
            --arg description "$body" \
            '{
              username: "TorrentNG releases",
              embeds: [{
                title: ("TorrentNG " + $tag + " released"),
                url: $url,
                description: $description,
                color: 3447003,
                fields: [
                  {name: "Tag", value: $tag, inline: true},
                  {name: "Release", value: $url, inline: false}
                ]
              }]
            }' > discord-payload.json
          curl -fsS \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_RELEASE_WEBHOOK"
