name: Release

on:
  push:
    tags:
      - "main-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  native-binaries:
    name: Native binary (${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            binary: torrentngd
            archive: tar.gz
          - os: ubuntu-24.04-arm
            suffix: linux-aarch64
            binary: torrentngd
            archive: tar.gz
          - os: macos-14
            suffix: macos-aarch64
            binary: torrentngd
            archive: tar.gz
          - os: windows-latest
            suffix: windows-x86_64
            binary: torrentngd.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ "$tag" != main-* ]]; then
            echo "Release tags must start with main-; got $tag." >&2
            exit 1
          fi
          git fetch --force origin main --tags
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $tag points at $tag_commit, which is not on origin/main." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build WebUI
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          TNG_WEBUI_OUT_DIR=dist npm run build

      - name: Build native daemon
        shell: bash
        run: cargo build --release --locked -p torrentngd

      - name: Smoke native daemon version
        shell: bash
        run: |
          set -euo pipefail
          "target/release/${{ matrix.binary }}" --version

      - name: Package native assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          suffix="${{ matrix.suffix }}"
          mkdir -p dist native/usr/bin native/usr/share/torrentng/webui
          cp "target/release/${{ matrix.binary }}" "dist/torrentngd-${suffix}${{ matrix.binary == 'torrentngd.exe' && '.exe' || '' }}"
          cp "target/release/${{ matrix.binary }}" "native/usr/bin/${{ matrix.binary }}"
          cp -a webui/dist/. native/usr/share/torrentng/webui/
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path native/* -DestinationPath dist/torrentngd-native-${tag}-${suffix}.zip -Force"
          else
            tar -czf "dist/torrentngd-native-${tag}-${suffix}.tar.gz" -C native .
          fi

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.suffix }}
          path: dist/*

  linux-release-assets:
    name: Linux containers and shared assets
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ "$tag" != main-* ]]; then
            echo "Release tags must start with main-; got $tag." >&2
            exit 1
          fi
          git fetch --force origin main --tags
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $tag points at $tag_commit, which is not on origin/main." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sidecar
        working-directory: sidecar
        run: cargo build --release --locked

      - name: Run sidecar tests
        working-directory: sidecar
        run: cargo test --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          TNG_WEBUI_OUT_DIR=dist npm run build

      - name: Build Docker images
        run: |
          docker build -f deploy/native/Dockerfile -t torrentng-native:${{ steps.tag.outputs.tag }} .
          docker build -f deploy/docker/Dockerfile -t torrentng:${{ steps.tag.outputs.tag }} .
          docker build -f deploy/docker/Dockerfile.phase1 -t torrentng-phase1:${{ steps.tag.outputs.tag }} .

      - name: Publish Docker images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#main-}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

          publish_image() {
            local local_image="$1"
            local ghcr_image="$2"
            local dockerhub_image="$3"
            for tag in "$RELEASE_TAG" "$version" latest; do
              docker tag "$local_image:$RELEASE_TAG" "$ghcr_image:$tag"
              docker push "$ghcr_image:$tag"
              if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
                docker tag "$local_image:$RELEASE_TAG" "$dockerhub_image:$tag"
                docker push "$dockerhub_image:$tag"
              fi
            done
          }

          publish_image torrentng-native ghcr.io/snapetech/torrentng/native snapetech/torrentng-native
          publish_image torrentng ghcr.io/snapetech/torrentng/sidecar snapetech/torrentng-sidecar
          publish_image torrentng-phase1 ghcr.io/snapetech/torrentng/phase1 snapetech/torrentng-phase1

      - name: Package shared assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          mkdir -p dist
          cp sidecar/target/release/torrentng "dist/torrentng-linux-x86_64"
          tar -czf "dist/torrentng-webui-${tag}.tar.gz" -C webui/dist .
          tar -czf "dist/torrentng-deploy-${tag}.tar.gz" deploy docs README.md LICENSE

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shared-linux-assets
          path: dist/*

  publish:
    name: Publish release
    runs-on: [self-hosted, Linux, X64]
    needs:
      - native-binaries
      - linux-release-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > "SHA256SUMS-${{ steps.tag.outputs.tag }}.txt"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "TorrentNG $tag" \
              --generate-notes \
              --verify-tag
          fi

      - name: Dispatch AUR publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run release-aur.yml --ref main -f tag="${{ steps.tag.outputs.tag }}"

      - name: Check Discord webhook configuration
        id: discord
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        shell: bash
        run: |
          if [[ -n "${DISCORD_RELEASE_WEBHOOK:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Announce release on Discord
        if: success() && steps.discord.outputs.configured == 'true'
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              username: "TorrentNG releases",
              embeds: [{
                title: ("TorrentNG " + $tag + " released"),
                url: $url,
                description: ("A new tagged release is available for `" + $repo + "`."),
                color: 3447003,
                fields: [
                  {name: "Tag", value: $tag, inline: true},
                  {name: "Release", value: $url, inline: false}
                ]
              }]
            }' > discord-payload.json
          curl -fsS \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_RELEASE_WEBHOOK"
