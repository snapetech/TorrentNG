name: YunoHost Bundle Release

on:
  push:
    tags:
      - "yunohost-*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate YunoHost release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag provenance
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^yunohost-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
            [[ "$RELEASE_TAG" == *..* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "Invalid YunoHost bundle tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force origin main --tags
          tag_commit="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ -z "$tag_commit" ]] || ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $RELEASE_TAG must point to a commit on origin/main." >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  bundles:
    name: YunoHost bundle (${{ matrix.suffix }})
    needs: validate-tag
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Build portable YunoHost bundle
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET_SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          docker buildx build \
            --pull \
            --platform "$PLATFORM" \
            --file packaging/yunohost/Dockerfile.bundle \
            --target bundle \
            --output "type=local,dest=bundle" \
            .
          test -x bundle/bin/torrentngd
          test -x bundle/bin/torrentng
          test -s bundle/webui/index.html
          bundle/bin/torrentngd --version
          bundle/bin/torrentng --version
          tar -czf "torrentng-yunohost-${RELEASE_TAG}-${ASSET_SUFFIX}.tar.gz" -C bundle .

      - name: Upload portable bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: yunohost-${{ matrix.suffix }}
          path: torrentng-yunohost-${{ needs.validate-tag.outputs.tag }}-${{ matrix.suffix }}.tar.gz

  publish:
    name: Publish YunoHost bundle release
    needs: [validate-tag, bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate bundle checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz > "SHA256SUMS-${RELEASE_TAG}.txt"

      - name: Create YunoHost bundle release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TorrentNG YunoHost bundle $RELEASE_TAG" \
            --notes "Portable TorrentNG binaries and WebUI assets for the YunoHost app package. This release does not publish the general TorrentNG release channels."
