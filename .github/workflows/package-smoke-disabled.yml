name: Package Smoke Disabled

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate
        required: true

permissions: {}

jobs:
  disabled:
    # Kept dormant intentionally; no workflow with this fixed name can match.
    if: github.workflow == '__disabled_package_smoke__'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run disabled package smoke
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: packaging/smoke/package-smoke torrentng github-binary "$RELEASE_TAG" --arch amd64
