name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

concurrency:
  group: torrentng-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-quality:
    timeout-minutes: 60
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate native API contract
        run: python3 scripts/validate_openapi.py

      - name: Test native workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint native workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run certification script self-tests
        run: |
          scripts/certification_policy_selftest.sh
          scripts/certification_bundle_selftest.sh
          scripts/storage_certification_selftest.sh

  backend-fault-matrix:
    name: Backend fault-containment matrix
    needs: native-quality
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run deterministic fault matrix
        run: |
          TNG_FAULT_MATRIX_STRICT=0 \
            scripts/backend_burndown_fault_matrix.sh \
            "certification/reports/backend-burndown-fault-matrix-ci-${GITHUB_RUN_ID}.md"

      - name: Upload fault matrix evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-fault-matrix-${{ github.run_id }}
          path: |
            certification/reports/backend-burndown-fault-matrix-ci-*
            certification/reports/backend-burndown-fault-*.log
          if-no-files-found: warn

  backend-api-load:
    name: Hosted native API/SSE load harness
    needs: native-quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native release daemon
        run: cargo build --release --locked -p torrentngd

      - name: Run concurrent API and slow-SSE load
        shell: bash
        run: |
          set -euo pipefail
          TORRENTNGD_CONFIG=certification/fixtures/backend-burndown-native-release-smoke.toml \
          TNG_STATIC_DIR=sidecar/static \
            target/release/torrentngd > /tmp/torrentng-api-load-${GITHUB_RUN_ID}.log 2>&1 &
          pid=$!
          cleanup() {
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            if curl -fsS \
              -H 'Authorization: Bearer backend-burndown-token-20260902' \
              http://127.0.0.1:28080/health >/dev/null; then
              break
            fi
            sleep 0.1
          done
          TNG_BASE_URL=http://127.0.0.1:28080 \
          TNG_API_TOKEN=backend-burndown-token-20260902 \
          TNG_LOAD_PID="$pid" \
          TNG_LOAD_DURATION_SECONDS=15 \
          TNG_LOAD_CLIENTS=16 \
          TNG_LOAD_SSE_CLIENTS=4 \
          TNG_LOAD_SLOW_DELAY_MS=100 \
            scripts/backend_burndown_api_load.py \
            "certification/reports/backend-api-load-ci-${GITHUB_RUN_ID}.md"

      - name: Upload API load evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-api-load-${{ github.run_id }}
          path: |
            certification/reports/backend-api-load-ci-*
            /tmp/torrentng-api-load-${{ github.run_id }}.log
          if-no-files-found: warn

  # TNG-025: the empirically-verified MSRV floor for this workspace's
  # locked dependency graph (see docs/BACKEND_AUDIT_BURN_DOWN.md) is
  # 1.88, declared in Cargo.toml's `rust-version` -- but `native-quality`
  # above tracks `@stable` (whatever's current), so nothing in CI actually
  # builds against the floor itself. Without this, MSRV drift (a
  # transitive dependency bump that needs a newer compiler than declared)
  # is only caught if someone happens to run it locally, which is exactly
  # how this session found .clippy.toml's own MSRV had drifted stale.
  msrv-check:
    timeout-minutes: 60
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.88.0 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Build native workspace at declared MSRV
        run: cargo build --workspace --all-targets --locked

      - name: Test native workspace at declared MSRV
        # The scale targets contain wall-clock assertions. Run the MSRV
        # suite serially so unrelated 15k/50k fixtures cannot steal CPU from
        # the endpoint being measured and turn the gate into scheduler noise.
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

  msrv-check-sidecar:
    timeout-minutes: 30
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.97.0 (sidecar's declared MSRV)
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Build sidecar at declared MSRV
        run: cargo build --locked --manifest-path sidecar/Cargo.toml

      - name: Test sidecar at declared MSRV
        run: cargo test --locked --manifest-path sidecar/Cargo.toml

  fuzz-smoke:
    timeout-minutes: 20
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # TNG-027: bounded smoke run, not a real fuzzing campaign -- this
      # exists to catch a target that's gone stale (no longer builds
      # against the current parser API) or an immediately-reachable
      # crash, not to find deep bugs on every PR. Each target gets a
      # fixed, short time budget so this job stays fast and deterministic
      # in CI; real fuzzing runs happen out-of-band with a much larger
      # budget.
      - name: Fuzz parse_torrent (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run parse_torrent -- -max_total_time=60

      - name: Fuzz bencode_decode (bounded smoke run)
        working-directory: fuzz
        run: cargo +nightly fuzz run bencode_decode -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  sidecar:
    timeout-minutes: 30
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sidecar
        run: cargo build --locked --manifest-path sidecar/Cargo.toml

      - name: Test sidecar
        run: cargo test --locked --manifest-path sidecar/Cargo.toml

  webui:
    timeout-minutes: 20
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: webui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: webui
        run: npx playwright install chromium

      - name: Build webui
        working-directory: webui
        run: npm run build

      - name: Lint webui
        working-directory: webui
        run: npm run lint

      - name: Run webui browser certification
        working-directory: webui
        run: npm run test:e2e -- --reporter=line

  backup-restore:
    name: Backup and restore drill
    needs: native-quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release daemon
        run: cargo build --release --locked -p torrentngd

      - name: Run disposable backup and restore certification
        run: |
          scripts/backup_restore_certification.sh \
            "certification/reports/backup-restore-ci-${GITHUB_RUN_ID}.md"

      - name: Upload backup and restore evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backup-restore-${{ github.run_id }}
          path: certification/reports/backup-restore-ci-*
          if-no-files-found: error

  security-audit:
    name: Dependency security audit
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Audit webui dependencies
        working-directory: webui
        run: npm audit --audit-level=high
