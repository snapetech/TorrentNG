[package]
name = "torrentng"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"

[lib]
name = "torrentng"
path = "src/lib.rs"

[[bin]]
name = "torrentng"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs", "limit", "trace"] }
hyper = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# SQLite
rusqlite = { version = "0.40", features = ["bundled", "functions"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rt-logging = { path = "../crates/rt-logging" }

# Error handling
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

# Config / env
dotenvy = "0.15"

# Per-install peer identity generation (see docs/TRACKER-IDENTITY.md)
rand = "0.8"

# Misc
bytes = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.42"
urlencoding = "2"
dirs-next = "2"
libc = "0.2"
reqwest = { version = "0.13", features = ["json", "multipart", "cookies", "form"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
