[package]
name = "torrentngd"
description = "TorrentNG: native Rust BitTorrent daemon with compatibility API facades"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "torrentngd"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

rusqlite.workspace = true

axum.workspace = true
tower-http = { workspace = true, features = ["fs"] }
rt-config     = { path = "../rt-config" }
rt-logging    = { path = "../rt-logging" }
rt-engine     = { path = "../rt-engine" }
rt-session    = { path = "../rt-session" }
rt-db         = { path = "../rt-db" }
rt-storage    = { path = "../rt-storage" }
rt-migrate    = { path = "../rt-migrate" }
rt-fastresume = { path = "../rt-fastresume" }
rt-api-native = { path = "../rt-api-native" }
rt-api-qbit   = { path = "../rt-api-qbit" }
rt-api-model  = { path = "../rt-api-model" }
rt-api-transmission = { path = "../rt-api-transmission" }
rt-api-deluge = { path = "../rt-api-deluge" }

[dev-dependencies]
tempfile.workspace = true
