# Checked-in generated corpus fixtures for deterministic strict local gates.
# Source/permission fields are intentionally explicit: these are not claimed to
# be third-party exports.

[[family]]
name = "qbittorrent"
versions = ["generated"]
expected = [".fastresume", ".torrent", "qBittorrent.conf"]
[[family.artifacts]]
path = "qbittorrent/generated.fastresume"
source = "TorrentNG generated qBittorrent/libtorrent-style resume fixture"
permission = "generated by TorrentNG test corpus; safe to commit"

