services:
  torrentng:
    image: torrentng:certification
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        TNG_UID: "${PUID:-1000}"
        TNG_GID: "${PGID:-1000}"
        TORRENTNG_SOURCE_REVISION: "${TORRENTNG_SOURCE_REVISION:-unknown}"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${TNG_HOST_PORT:-18080}:8080"
      - "${TNG_INCOMING_PORT:-50000}:50000"
      - "${TNG_INCOMING_PORT:-50000}:50000/udp"
    volumes:
      - ./sidecar.config.toml:/config/config.toml:ro
      - tng-data:/var/lib/torrentng
      - downloads:/data
      - session:/session
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TORRENTNG_CONFIG: /config/config.toml
      RTORRENT_INCOMING_PORT: "${TNG_INCOMING_PORT:-50000}"
      RTORRENT_SCGI_SOCKET: /run/rtorrent/rpc.sock
      TNG_STATIC_DIR: /usr/share/torrentng/webui
      TNG_SYNC_INTERVAL_SECS: "${TNG_SYNC_INTERVAL_SECS:-2}"
      TNG_DATA_DIR: "${TNG_DATA_DIR:-/var/lib/torrentng}"
      # These deterministic values are only for the local certification stack;
      # production deployments must override both with unique secrets.
      TNG_SECRET_KEY: "${TNG_SECRET_KEY:-local-cert-session-secret-20260904-0123456789abcdef}"
      TNG_API_TOKENS: "${TNG_API_TOKEN:-local-cert-api-token-20260904}"
      TNG_USER_AGENT: "${TNG_USER_AGENT:-rtorrent/0.16.11/0.16.11}"
      # TNG_PEER_ID is deliberately not defaulted here: the compatible-client service generates
      # and persists a unique per-install id under data_dir on first start
      # (see docs/TRACKER-IDENTITY.md). Set TNG_PEER_ID only to pin a value.
      TNG_QBITTORRENT_VERSION: "${TNG_QBITTORRENT_VERSION:-5.0.0}"
      TNG_QBITTORRENT_WEBAPI_VERSION: "${TNG_QBITTORRENT_WEBAPI_VERSION:-2.11.0}"
      TNG_QBITTORRENT_BUILD_LIBTORRENT: "${TNG_QBITTORRENT_BUILD_LIBTORRENT:-0.16.11}"
      TNG_QBITTORRENT_BUILD_QT: "${TNG_QBITTORRENT_BUILD_QT:-6.7.0}"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -S /run/rtorrent/rpc.sock && wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8

  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:a5c1a5fecbef946927ab90ad68df319ac5fe644057e5fc18cd993f01ac07b2b2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SONARR_HOST_PORT:-18989}:8989"
    volumes:
      - sonarr-config:/config
      - downloads:/downloads
      - media-tv:/tv
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    depends_on:
      - torrentng

  radarr:
    image: lscr.io/linuxserver/radarr@sha256:c960f2b52ec6542dbe6707c5a21e696a7c74fd8b17997454f4d10a55dacee133
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RADARR_HOST_PORT:-17878}:7878"
    volumes:
      - radarr-config:/config
      - downloads:/downloads
      - media-movies:/movies
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    depends_on:
      - torrentng

  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:c96b56d94d116a9f4de94bc23d3381689492e6c3cfb7435320e8d982e406f99a
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROWLARR_HOST_PORT:-19696}:9696"
    volumes:
      - prowlarr-config:/config
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    depends_on:
      - torrentng

  autobrr:
    image: ghcr.io/autobrr/autobrr@sha256:0b8b997c40424557a4bd688a4cb487dd8a765a69b5aa5b003c0d8106f6a895af
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTOBRR_HOST_PORT:-17474}:7474"
    volumes:
      - autobrr-config:/config
    environment:
      AUTOBRR__HOST: 0.0.0.0
      AUTOBRR__PORT: "7474"
      AUTOBRR__LOG_LEVEL: debug
      AUTOBRR__SESSION_SECRET: local-cert-autobrr-session-secret-20260904
    depends_on:
      - torrentng

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed@sha256:a1fed512261fd968c55cb03c51cff9c6620aa76a34b3b591afca95c890aa8225
    restart: unless-stopped
    command: daemon
    ports:
      - "127.0.0.1:${CROSS_SEED_HOST_PORT:-12468}:2468"
    volumes:
      - ./cross-seed.config.js:/config/config.js:ro
      - cross-seed-output:/config/output
      - downloads:/downloads
    environment:
      TZ: "${TZ:-Etc/UTC}"
    depends_on:
      - torrentng

volumes:
  tng-data:
  downloads:
  session:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  autobrr-config:
  cross-seed-output:
  media-tv:
  media-movies:
