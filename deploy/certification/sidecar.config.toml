listen_addr = "0.0.0.0:8080"
sync_interval_secs = 2
data_dir = "/var/lib/torrentng"
storage_roots = ["/data"]

[backend]
type = "rtorrent"

[rtorrent]
scgi_socket = "/run/rtorrent/rpc.sock"
timeout_secs = 10
user_agent = "rtorrent/0.16.11/0.16.11"

[auth]
secret_key = "local-cert-session-secret-20260904-0123456789abcdef"
api_tokens = ["local-cert-api-token-20260904"]
trust_proxy_header = false

[workflows]
allow_scripts = false
script_timeout_secs = 30
allowed_script_dirs = []
