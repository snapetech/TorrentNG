server {
    listen 80;
    server_name _;

    # ruTorrent UI
    root /var/www/rutorrent;
    index index.html index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php83-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # rTorrent SCGI via httprpc plugin
    # The httprpc plugin in ruTorrent proxies XMLRPC to the SCGI socket.
    # Direct SCGI exposure is intentionally absent.

    # ruTorrent plugin uploads
    client_max_body_size 64M;
}
