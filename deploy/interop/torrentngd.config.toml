[daemon]
api_bind = "0.0.0.0:8080"
session_dir = "/var/lib/torrentngd"
log_level = "info"
shutdown_timeout_secs = 10

[network]
listen_port = 6881
max_peers = 400
upload_rate_limit = 0
download_rate_limit = 0

[storage]
download_dir = "/downloads/torrentngd"

[tracker]
http_timeout_secs = 30
udp_timeout_secs = 15
min_interval_secs = 0
# The interop harness is an isolated Docker network. Permit its private
# tracker/webseed addresses here; production defaults remain deny-by-default.
allow_private_egress = true

[dht]
enabled = true
port = 6881
bootstrap_nodes = [
  "dht.transmissionbt.com:6881",
  "router.bittorrent.com:6881",
  "router.utorrent.com:6881",
]

[db]
path = "/var/lib/torrentngd/state.db"
wal_checkpoint_pages = 1000

[auth]
api_tokens = ["interop-backend-token-20260904"]

[logging]
format = "json"
profile = "basic"
filter = ""
event_retention = 10000
