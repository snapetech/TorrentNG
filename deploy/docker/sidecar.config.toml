listen_addr = "0.0.0.0:8080"
sync_interval_secs = 2
data_dir = "/var/lib/torrentng"
storage_roots = ["/data"]

[backend]
type = "rtorrent"

[rtorrent]
scgi_socket = "/run/rtorrent/rpc.sock"
timeout_secs = 10
user_agent = "rtorrent/0.16.11/0.16.11"
# peer_id is intentionally omitted: the sidecar generates and persists a
# unique per-install suffix on first start (see docs/TRACKER-IDENTITY.md).
# Set TNG_PEER_ID (or this field) only if you need to pin a specific value.

[rtorrent.logs]
enabled = false
paths = ["/var/log/rtorrent/rtorrent.log"]
poll_interval_secs = 2
read_from_start = false

[auth]
secret_key = "change-me"
api_tokens = []
trust_proxy_header = false

[logging]
format = "json"
profile = "basic"
filter = ""
event_retention = 10000

[workflows]
allow_scripts = false
script_timeout_secs = 30
allowed_script_dirs = []
