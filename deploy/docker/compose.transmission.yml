services:
  torrentng-transmission:
    image: torrentng:latest
    profiles: ["transmission"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        TNG_UID: "${PUID:-1000}"
        TNG_GID: "${PGID:-1000}"
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - ./config-transmission:/config:ro
      - downloads:/data
      - torrentng-transmission-state:/var/lib/torrentng
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TORRENTNG_CONFIG: /config/config.toml
      TNG_BACKEND: transmission
      TNG_TRANSMISSION_URL: http://transmission:9091/transmission/rpc
      TNG_TRANSMISSION_USERNAME: "${TRANSMISSION_USERNAME:?TRANSMISSION_USERNAME must be set for this profile}"
      TNG_TRANSMISSION_PASSWORD: "${TRANSMISSION_PASSWORD:?TRANSMISSION_PASSWORD must be set for this profile}"
      TNG_SECRET_KEY: "${TNG_SECRET_KEY:?TNG_SECRET_KEY must be set to a random secret}"
      TNG_API_TOKENS: "${TNG_API_TOKENS:?TNG_API_TOKENS must be set to one or more tokens}"
    depends_on:
      - transmission
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    profiles: ["transmission"]
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      USER: "${TRANSMISSION_USERNAME:?TRANSMISSION_USERNAME must be set for this profile}"
      PASS: "${TRANSMISSION_PASSWORD:?TRANSMISSION_PASSWORD must be set for this profile}"
      PEERPORT: "51413"
    volumes:
      - transmission_config:/config
      - downloads:/downloads
    ports:
      - "127.0.0.1:9091:9091"
      - "51413:51413"
      - "51413:51413/udp"

volumes:
  downloads:
  torrentng-transmission-state:
  transmission_config:
