services:
  rtorrentng-phase1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.phase1
    image: rtorrentng-phase1:latest
    container_name: rtorrentng-phase1
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "${PHASE1_HTTP_PORT:-8080}:80"                       # ruTorrent web UI
      - "${PHASE1_INCOMING_PORT:-50000}:50000"               # rTorrent incoming
      - "${PHASE1_INCOMING_PORT:-50000}:50000/udp"
    volumes:
      - ./config:/config          # optional user config overlay
      - downloads:/data           # download directory
      - session:/session          # rTorrent session
    environment:
      TZ: UTC
      RTORRENT_INCOMING_PORT: "${PHASE1_INCOMING_PORT:-50000}"
      RTORRENT_SCGI_SOCKET: /run/rtorrent/rpc.sock
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -S /run/rtorrent/rpc.sock && curl -sf http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  downloads:
  session:
