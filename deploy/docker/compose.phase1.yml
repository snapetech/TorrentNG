services:
  torrentng-phase1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.phase1
      args:
        TNG_UID: "${PUID:-1000}"
        TNG_GID: "${PGID:-1000}"
    image: torrentng-phase1:latest
    container_name: torrentng-phase1
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PHASE1_HTTP_BIND:-127.0.0.1}:${PHASE1_HTTP_PORT:-8080}:8080" # unauthenticated ruTorrent UI: local by default
      - "${PHASE1_INCOMING_PORT:-50000}:${PHASE1_CONTAINER_INCOMING_PORT:-50000}" # host:container rTorrent incoming
      - "${PHASE1_INCOMING_PORT:-50000}:${PHASE1_CONTAINER_INCOMING_PORT:-50000}/udp"
    volumes:
      - ./config:/config:ro       # optional user config overlay
      - downloads:/data           # download directory
      - session:/session          # rTorrent session
    environment:
      TZ: UTC
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      RTORRENT_INCOMING_PORT: "${PHASE1_CONTAINER_INCOMING_PORT:-50000}"
      RTORRENT_SCGI_SOCKET: /run/rtorrent/rpc.sock
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -S /run/rtorrent/rpc.sock && curl -sf http://127.0.0.1:8080/ >/dev/null && curl -sf http://127.0.0.1:8080/php/getsettings.php >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  downloads:
  session:
