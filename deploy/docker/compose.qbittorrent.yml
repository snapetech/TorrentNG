services:
  torrentng-qbittorrent:
    image: torrentng:latest
    profiles: ["qbittorrent"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        TNG_UID: "${PUID:-1000}"
        TNG_GID: "${PGID:-1000}"
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./config-qbittorrent:/config:ro
      - downloads:/data
      - torrentng-qbittorrent-state:/var/lib/torrentng
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TORRENTNG_CONFIG: /config/config.toml
      TNG_BACKEND: qbittorrent
      TNG_QBITTORRENT_URL: http://qbittorrent:8080
      TNG_QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME:?QBITTORRENT_USERNAME must be set for this profile}"
      TNG_QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD:?QBITTORRENT_PASSWORD must be set for this profile}"
      TNG_SECRET_KEY: "${TNG_SECRET_KEY:?TNG_SECRET_KEY must be set to a random secret}"
      TNG_API_TOKENS: "${TNG_API_TOKENS:?TNG_API_TOKENS must be set to one or more tokens}"
    depends_on:
      - qbittorrent
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    profiles: ["qbittorrent"]
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - qbittorrent_config:/config
      - downloads:/downloads
    ports:
      - "127.0.0.1:8081:8080"
      - "6881:6881"
      - "6881:6881/udp"

volumes:
  downloads:
  torrentng-qbittorrent-state:
  qbittorrent_config:
