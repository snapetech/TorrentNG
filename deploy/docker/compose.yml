services:
  torrentng:
    image: torrentng:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        TNG_UID: "${PUID:-1000}"
        TNG_GID: "${PGID:-1000}"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080" # compatible-client WebUI/API; use TLS for remote access
      - "50000:50000"     # rTorrent incoming port (adjust to match rtorrent.rc)
      - "50000:50000/udp"
    volumes:
      - ./config:/config:ro
      - downloads:/data
      - session:/session
      - torrentng-state:/var/lib/torrentng
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TORRENTNG_CONFIG: /config/config.toml
      RTORRENT_INCOMING_PORT: "50000"
      RTORRENT_SCGI_SOCKET: /run/rtorrent/rpc.sock
      TNG_RTORRENT_OVERLAY: /var/lib/torrentng/rtorrent-ui-overlay.rc
      TNG_SECRET_KEY: "${TNG_SECRET_KEY:?TNG_SECRET_KEY must be set to a random secret}"
      TNG_API_TOKENS: "${TNG_API_TOKENS:?TNG_API_TOKENS must be set to one or more tokens}"
      TNG_USER_AGENT: "${TNG_USER_AGENT:-rtorrent/0.16.11/0.16.11}"
      # TNG_PEER_ID is deliberately not defaulted here: the compatible-client service generates
      # and persists a unique per-install id under data_dir on first start
      # (see docs/TRACKER-IDENTITY.md). Set TNG_PEER_ID only to pin a value.
      TNG_QBITTORRENT_VERSION: "${TNG_QBITTORRENT_VERSION:-5.0.0}"
      TNG_QBITTORRENT_WEBAPI_VERSION: "${TNG_QBITTORRENT_WEBAPI_VERSION:-2.11.0}"
      TNG_QBITTORRENT_BUILD_LIBTORRENT: "${TNG_QBITTORRENT_BUILD_LIBTORRENT:-0.16.11}"
      TNG_QBITTORRENT_BUILD_QT: "${TNG_QBITTORRENT_BUILD_QT:-6.7.0}"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -S /run/rtorrent/rpc.sock && wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80" # HTTP-only front door; terminate TLS before remote exposure
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - torrentng

volumes:
  downloads:
  session:
  torrentng-state:
