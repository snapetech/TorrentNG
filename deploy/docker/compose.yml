services:
  rtorrentng:
    image: rtorrentng:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"       # sidecar API + WebUI (put nginx in front for production)
      - "50000:50000"     # rTorrent incoming port (adjust to match rtorrent.rc)
      - "50000:50000/udp"
    volumes:
      - ./config:/config
      - downloads:/data
      - session:/session
    environment:
      RTORRENTNG_CONFIG: /config/config.toml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rtorrentng

volumes:
  downloads:
  session:
