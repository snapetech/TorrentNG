services:
  torrentng:
    image: torrentng:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "8080:8080"       # sidecar API + WebUI (put nginx in front for production)
      - "50000:50000"     # rTorrent incoming port (adjust to match rtorrent.rc)
      - "50000:50000/udp"
    volumes:
      - ./config:/config
      - downloads:/data
      - session:/session
    environment:
      TORRENTNG_CONFIG: /config/config.toml
      RTORRENT_INCOMING_PORT: "50000"
      RTORRENT_SCGI_SOCKET: /run/rtorrent/rpc.sock
      TNG_SECRET_KEY: "${TNG_SECRET_KEY:-change-me}"
      TNG_API_TOKENS: "${TNG_API_TOKENS:-}"
      TNG_USER_AGENT: "${TNG_USER_AGENT:-rtorrent/0.16.11}"
      TNG_QBITTORRENT_VERSION: "${TNG_QBITTORRENT_VERSION:-5.0.0}"
      TNG_QBITTORRENT_WEBAPI_VERSION: "${TNG_QBITTORRENT_WEBAPI_VERSION:-2.11.0}"
      TNG_QBITTORRENT_BUILD_LIBTORRENT: "${TNG_QBITTORRENT_BUILD_LIBTORRENT:-0.16.11}"
      TNG_QBITTORRENT_BUILD_QT: "${TNG_QBITTORRENT_BUILD_QT:-6.7.0}"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -S /run/rtorrent/rpc.sock && wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  torrentng-qbittorrent:
    image: torrentng:latest
    profiles: ["qbittorrent"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - ./config-qbittorrent:/config
      - downloads:/data
    environment:
      TORRENTNG_CONFIG: /config/config.toml
      TNG_BACKEND: qbittorrent
      TNG_QBITTORRENT_URL: http://qbittorrent:8080
      TNG_QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME:-admin}"
      TNG_QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD:-adminadmin}"
      TNG_SECRET_KEY: "${TNG_SECRET_KEY:-change-me}"
      TNG_API_TOKENS: "${TNG_API_TOKENS:-}"
    depends_on:
      - qbittorrent
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    profiles: ["qbittorrent"]
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-UTC}"
      WEBUI_PORT: "8080"
    volumes:
      - qbittorrent_config:/config
      - downloads:/downloads
    ports:
      - "8081:8080"
      - "6881:6881"
      - "6881:6881/udp"

  torrentng-transmission:
    image: torrentng:latest
    profiles: ["transmission"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      - ./config-transmission:/config
      - downloads:/data
    environment:
      TORRENTNG_CONFIG: /config/config.toml
      TNG_BACKEND: transmission
      TNG_TRANSMISSION_URL: http://transmission:9091/transmission/rpc
      TNG_TRANSMISSION_USERNAME: "${TRANSMISSION_USERNAME:-}"
      TNG_TRANSMISSION_PASSWORD: "${TRANSMISSION_PASSWORD:-}"
      TNG_SECRET_KEY: "${TNG_SECRET_KEY:-change-me}"
      TNG_API_TOKENS: "${TNG_API_TOKENS:-}"
    depends_on:
      - transmission
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    profiles: ["transmission"]
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-UTC}"
    volumes:
      - transmission_config:/config
      - downloads:/downloads
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"

  torrentng-deluge:
    image: torrentng:latest
    profiles: ["deluge"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8080"
    volumes:
      - ./config-deluge:/config
      - downloads:/data
    environment:
      TORRENTNG_CONFIG: /config/config.toml
      TNG_BACKEND: deluge
      TNG_DELUGE_URL: http://deluge:8112/json
      TNG_DELUGE_PASSWORD: "${DELUGE_PASSWORD:-deluge}"
      TNG_SECRET_KEY: "${TNG_SECRET_KEY:-change-me}"
      TNG_API_TOKENS: "${TNG_API_TOKENS:-}"
    depends_on:
      - deluge
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    profiles: ["deluge"]
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-UTC}"
    volumes:
      - deluge_config:/config
      - downloads:/downloads
    ports:
      - "8112:8112"
      - "58846:58846"
      - "58946:58946"
      - "58946:58946/udp"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - torrentng

volumes:
  downloads:
  session:
  qbittorrent_config:
  transmission_config:
  deluge_config:
