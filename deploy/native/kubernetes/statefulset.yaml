apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: torrentngd
  namespace: torrentng
spec:
  serviceName: torrentngd
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: torrentngd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: torrentngd
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: torrentngd
          image: torrentng/torrentngd:local
          imagePullPolicy: IfNotPresent
          env:
            - name: TORRENTNGD_CONFIG
              value: /etc/torrentngd/config.toml
            - name: RUST_LOG
              value: info
          ports:
            - name: http
              containerPort: 8080
            - name: bittorrent-tcp
              containerPort: 44444
              protocol: TCP
            - name: bittorrent-udp
              containerPort: 44444
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/torrentngd
              readOnly: true
            - name: state
              mountPath: /var/lib/torrentngd
            - name: downloads
              mountPath: /data
      volumes:
        - name: config
          secret:
            name: torrentngd-config
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: downloads
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
