apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rusttorrentd
  namespace: rtorrentng
spec:
  serviceName: rusttorrentd
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rusttorrentd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rusttorrentd
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: rusttorrentd
          image: rtorrentng/rusttorrentd:local
          imagePullPolicy: IfNotPresent
          env:
            - name: RUSTTORRENTD_CONFIG
              value: /etc/rusttorrentd/config.toml
            - name: RUST_LOG
              value: info
          ports:
            - name: http
              containerPort: 8080
            - name: bittorrent-tcp
              containerPort: 6881
              protocol: TCP
            - name: bittorrent-udp
              containerPort: 6881
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/rusttorrentd
              readOnly: true
            - name: state
              mountPath: /var/lib/rusttorrentd
            - name: downloads
              mountPath: /data
      volumes:
        - name: config
          secret:
            name: rusttorrentd-config
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: downloads
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
