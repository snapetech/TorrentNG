apiVersion: v1
kind: Service
metadata:
  name: torrentngd
  namespace: torrentng
  labels:
    app.kubernetes.io/name: torrentngd
spec:
  selector:
    app.kubernetes.io/name: torrentngd
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: bittorrent-tcp
      port: 6881
      targetPort: bittorrent-tcp
      protocol: TCP
    - name: bittorrent-udp
      port: 6881
      targetPort: bittorrent-udp
      protocol: UDP
