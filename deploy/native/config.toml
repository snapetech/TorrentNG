[daemon]
api_bind = "0.0.0.0:8080"
session_dir = "/var/lib/torrentngd"
log_level = "info"
shutdown_timeout_secs = 10

[network]
listen_port = 6881
max_peers = 200
upload_rate_limit = 0
download_rate_limit = 0

[storage]
download_dir = "/data"
device_elevator_enabled = true

[memory]
total_cap_mb = 512
storage_frame_cap_mb = 128
queued_disk_cap_mb = 64
piece_assembly_cap_mb = 128
peer_buffer_cap_mb = 128
metadata_cap_mb = 32
pressure_constrained_pct = 75
pressure_critical_pct = 90

[runtime]
torrent_tiers_enabled = true

[tracker]
http_timeout_secs = 30
udp_timeout_secs = 15
min_interval_secs = 0

[dht]
enabled = true
port = 0
bootstrap_nodes = [
  "dht.transmissionbt.com:6881",
  "router.bittorrent.com:6881",
  "router.utorrent.com:6881",
]

[db]
path = "/var/lib/torrentngd/state.db"
wal_checkpoint_pages = 1000

[auth]
api_tokens = ["change-me"]

[logging]
format = "json"
profile = "basic"
filter = ""
event_retention = 10000
