[daemon]
api_bind = "0.0.0.0:8080"
session_dir = "/var/lib/torrentngd"
log_level = "info"
shutdown_timeout_secs = 10

[network]
listen_port = 44444
max_peers = 200
upload_rate_limit = 0
download_rate_limit = 0

[storage]
download_dir = "/data"
device_elevator_enabled = true

[crash_safety]
# Power-loss and crash protection. The defaults are safe for local ext4, xfs,
# btrfs and zfs storage; see docs/CRASH_SAFETY.md. All keys are also editable at
# runtime from the WebUI (Settings -> Backend -> Crash safety).
# host_crash_recovery = "recent"    # "watermark" | "recent" | "full"
# completion_verify = "off"         # "off" | "sample" | "full"
# weak_mount_paths = []             # storage whose fsync you distrust, e.g. ["/mnt/mergerfs"]
#
# Per-location overrides for mixed storage (longest matching path wins; unset
# keys inherit the values above):
# [[crash_safety.path_policies]]
# path = "/mnt/nas"
# host_crash_recovery = "full"
# completion_verify = "sample"

[memory]
total_cap_mb = 512
storage_frame_cap_mb = 128
queued_disk_cap_mb = 64
piece_assembly_cap_mb = 128
piece_index_cap_mb = 128
peer_buffer_cap_mb = 128
metadata_cap_mb = 32
pressure_constrained_pct = 75
pressure_critical_pct = 90

[runtime]
torrent_tiers_enabled = true
tier_hot_idle_secs = 120
tier_warm_idle_secs = 1800

[tracker]
http_timeout_secs = 30
udp_timeout_secs = 15
min_interval_secs = 0

[dht]
enabled = true
port = 0
bootstrap_nodes = [
  "dht.transmissionbt.com:6881",
  "router.bittorrent.com:6881",
  "router.utorrent.com:6881",
]

[db]
path = "/var/lib/torrentngd/state.db"
wal_checkpoint_pages = 1000

[auth]
# When password is omitted, torrentngd generates a unique value in the session
# directory. Retrieve the active WebUI login with `torrentngd auth-token`.
username = "torrentng"
# Compose mounts the one deployment token at this path. For a non-Compose
# deployment, provide the same newline-delimited secret file or replace this
# with api_tokens = ["..."] in a private config.
api_tokens_file = "/run/secrets/torrentngd_api_token"

[logging]
format = "json"
profile = "basic"
filter = ""
event_retention = 10000
