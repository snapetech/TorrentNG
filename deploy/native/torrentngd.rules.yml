groups:
  - name: torrentngd-backend
    rules:
      - alert: TorrentNGStorageDispatcherSaturated
        expr: >-
          torrentng_storage_jobs_capacity > 0
          and torrentng_storage_jobs_inflight >= torrentng_storage_jobs_capacity
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TorrentNG storage-job dispatcher is saturated
          description: >-
            Durable storage work has occupied the complete end-to-end
            dispatcher capacity for at least 10 minutes. New moves/rechecks
            will be rejected until work drains or operators intervene.

      - alert: TorrentNGStorageWorkersUnhealthy
        expr: torrentng_storage_supervisor_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TorrentNG storage-job supervisor is unhealthy
          description: >-
            The storage-job supervisor is not live. Storage plans are not
            safe to submit until the daemon recovers or is restarted.

      - alert: TorrentNGDatabaseWorkerUnhealthy
        expr: torrentng_database_worker_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TorrentNG database worker is unhealthy
          description: >-
            Authoritative session persistence is unavailable. Mutations may
            be rejected or remain uncommitted; inspect the daemon logs and
            restart only after preserving the session backup.

      - alert: TorrentNGPeerListenerUnhealthy
        expr: torrentng_peer_listener_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TorrentNG peer listener is unhealthy
          description: >-
            The native peer listener is not accepting work. Existing API
            state may still look healthy while transfers are stalled.

      - alert: TorrentNGDhtUnhealthy
        expr: torrentng_dht_enabled == 1 and torrentng_dht_healthy == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TorrentNG DHT task is unhealthy
          description: >-
            DHT is enabled but its task is not healthy. Tracker-backed
            transfers may continue; inspect DHT task logs and restart state.

      - alert: TorrentNGTrackerErrorRatioHigh
        expr: >-
          torrentng_trackers_total > 0
          and torrentng_trackers_error_ratio_milli > 250
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TorrentNG tracker error ratio is above 25 percent
          description: >-
            More than one quarter of persisted tracker rows are in error
            state. Check tracker reachability, egress policy, and DNS.

      - alert: TorrentNGStorageReadLatencyP95High
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(torrentng_storage_read_latency_nanoseconds_bucket[5m])
            )
          ) > 5000000000
          and rate(torrentng_storage_read_latency_nanoseconds_count[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TorrentNG storage read p95 exceeds five seconds
          description: >-
            Sustained end-to-end read latency is high. Check mount health,
            device queue saturation, and storage-worker contention.

      - alert: TorrentNGApiSnapshotExpiry
        expr: increase(torrentng_api_snapshot_expired_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TorrentNG API snapshot cursors are expiring frequently
          description: >-
            More than ten pagination cursors expired in five minutes. Clients
            may be retrying full snapshot pagination instead of progressing.

      - alert: TorrentNGApiSseResyncStorm
        expr: increase(torrentng_api_sse_resyncs_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TorrentNG SSE clients are resynchronizing frequently
          description: >-
            More than ten SSE journal resynchronizations occurred in five
            minutes. Check mutation churn, slow consumers, and journal size.

      - alert: TorrentNGApiSseSlowConsumers
        expr: increase(torrentng_api_sse_lagged_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TorrentNG SSE clients are falling behind
          description: >-
            More than ten SSE polls were delayed by over three seconds in five
            minutes. Check downstream consumers, proxies, and API saturation.
