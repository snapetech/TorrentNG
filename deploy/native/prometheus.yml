global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/torrentngd.rules.yml

scrape_configs:
  - job_name: torrentngd
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/torrentngd_api_token
    static_configs:
      - targets:
          - torrentngd:8080
